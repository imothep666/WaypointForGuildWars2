<!DOCTYPE html>
<!--
    Paints the dry-brush stroke the app draws under a live tab, a section's heading and the bar's
    live entry: white hairs on transparent, used as an opacity mask over the area's tint.

    A brush loaded at its heart and dry at its edges: in the middle every hair carries paint, and
    towards each end the hairs run out one by one, each at its own place, breaking into dashes
    before they stop. Seeded, so the same stroke comes out every time.

    Render with headless Chrome:
        chrome --headless=new --default-background-color=00000000 --window-size=560,42
               --screenshot=brushstroke.png render-brushstroke.html
    The preview flag (?preview) paints three tinted copies on obsidian instead.
-->
<html>
<head>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Twice the size the phone draws the longest stroke, under a section's heading: few enough hairs
// that each is still a hair once it is shrunk, rather than a smooth smear.
const W = 560, H = 42;
const preview = location.search.includes("preview");

// Mulberry32: small, seeded, good enough for bristles.
let seed = 20261007;
const random = () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

function paint(g, ox, oy) {
  const hairs = 16;
  for (let i = 0; i < hairs; i++) {
    // Where across the brush this hair sits, -1 (top) to 1 (bottom).
    const across = (i / (hairs - 1)) * 2 - 1;
    // Outer hairs are shorter: the brush is loaded at its heart.
    const reach = 1 - Math.abs(across) * 0.55;
    const start = (0.01 + random() * 0.3 + (1 - reach) * 0.2) * W;
    const end = (0.99 - random() * 0.28 - (1 - reach) * 0.18) * W;
    // Where the hair lies across the brush; the brush narrows where it touches down and lifts.
    const spread = H * 0.38;
    const thickness = 1.5 + random() * 0.9;
    const strength = 0.55 + random() * 0.45;

    for (let x = start; x < end; x += 1) {
      const t = (x - start) / (end - start);
      // How dry the brush is here: wet in the middle, dry towards the ends of this hair.
      const dry = Math.max(0, Math.abs(t - 0.45) * 2 - 0.35) / 0.65;
      if (random() < dry * dry * 0.9) continue;            // the hair skips, as dry paint does
      if (random() < 0.035) continue;                       // and now and then even mid-stroke
      const along = x / W;
      const width = 0.45 + 0.55 * Math.sin(Math.PI * along); // narrow at the ends, full at the heart
      const baseY = H / 2 + across * spread * width;
      const sag = Math.sin(Math.PI * along) * -2.5;           // a slight arc, as a wrist makes
      const alpha = strength * (1 - dry * 0.6);
      g.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
      g.fillRect(ox + x, oy + baseY + sag, 1.4, thickness);
    }
  }
}

const c = document.getElementById("c");
if (!preview) {
  c.width = W; c.height = H;
  paint(c.getContext("2d"), 0, 0);
} else {
  c.width = W + 40; c.height = 3 * (H + 40) + 24;
  const g = c.getContext("2d");
  g.fillStyle = "#0F141B"; g.fillRect(0, 0, c.width, c.height);
  ["#46B7AE", "#D9894A", "#C08F95"].forEach((tint, k) => {
    const layer = document.createElement("canvas"); layer.width = W; layer.height = H;
    seed = 20261007;
    paint(layer.getContext("2d"), 0, 0);
    const lg = layer.getContext("2d");
    lg.globalCompositeOperation = "source-in"; lg.fillStyle = tint; lg.fillRect(0, 0, W, H);
    g.drawImage(layer, 20, 24 + k * (H + 40));
    // And at the size the phone draws it under a heading: about 280 by 21 pixels.
    g.drawImage(layer, 40, 24 + k * (H + 40) + H + 4, 280, 21);
    // And under the bar's live entry: about 80 by 14.
    g.drawImage(layer, 360, 24 + k * (H + 40) + H + 8, 80, 14);
  });
}
</script>
</body>
</html>
