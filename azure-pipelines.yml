# Builds the desktop app and the PC Bridge, keeps them as a pipeline artifact, and on main
# publishes them as one GitHub release that installed copies update from (see VelopackUpdates in
# the desktop project, which the bridge compiles too).
#
# Each package below is published, packed by Velopack's vpk and uploaded on its own channel, so an
# install is only ever offered updates for what it is: the app as an AppImage for Linux arm64 and
# x64, the bridge as an AppImage for Linux x64 and a Setup.exe for Windows. Everything is built on
# one Linux agent; vpk packs the Windows bridge from there with its [win] directive.
#
# Set up once, in the pipeline's variables (Edit > Variables), not here:
#   ReleasesRepo   https://github.com/<owner>/<repo>, the public repository the releases go to.
#                  It needs one commit (a README will do) before a release can be tagged in it.
#   GitHubToken    secret. A fine-grained token for that repository alone, with Contents: read and
#                  write, which is what creating a release and uploading to it takes.
#
# The version is the repository's own, from Directory.Build.targets: 1.0.<commits on main>.
#
# Not on every push. A run is a release, and a release costs a good share of the free tier's 1,800
# hosted minutes a month; a day of small pushes spent them on releases nobody asked for. Instead:
#   - by hand, whenever wanted (Pipelines > Run pipeline);
#   - nightly at 02:00 UTC, only when main has moved and its newest commit is not released yet.
# A release lists every commit since the one before it, so nothing is lost by releasing less often.
#
# Only the packages that changed. tools/changed_packages.py compares what each project is made of
# with the commit the last release was built from, and a package with nothing new is left out of
# the release; its installs keep updating from the release that last carried it, because Velopack
# reads each channel's feed from all recent releases. "Build every package", when starting a run by
# hand, packs all of them, for a change to how they are packed.

trigger: none

# always: false is Azure's own "only if changed", but it compares with the last scheduled run
# alone, so a commit released by hand that day would be released again overnight. The first step
# below checks the latest release itself.
schedules:
  - cron: "0 2 * * *"
    displayName: Nightly, when main has changed
    branches:
      include: [main]
    always: false

pr: none

pool:
  vmImage: ubuntu-latest

parameters:
  - name: everything
    displayName: Build every package, changed or not
    type: boolean
    default: false

  # channel: Velopack's, and the name in the feed file; unique across the whole release.
  # exe: the file vpk treats as the program. directive: vpk's cross-packing switch, [win] for a
  # Setup.exe made on this Linux agent. extra: options only one kind of package takes.
  - name: packages
    type: object
    default:
      - channel: linux-arm64
        rid: linux-arm64
        project: GuildWarsCompanion.Avalonia.Desktop/GuildWarsCompanion.Avalonia.Desktop.csproj
        packId: Waypoint
        title: Waypoint
        exe: GuildWarsCompanion.Desktop
        icon: GuildWarsCompanion.Avalonia.Android/Resources/mipmap-xxxhdpi/appicon.png
        directive: ''
        extra: --categories "Game;Utility"
      - channel: linux-x64
        rid: linux-x64
        project: GuildWarsCompanion.Avalonia.Desktop/GuildWarsCompanion.Avalonia.Desktop.csproj
        packId: Waypoint
        title: Waypoint
        exe: GuildWarsCompanion.Desktop
        icon: GuildWarsCompanion.Avalonia.Android/Resources/mipmap-xxxhdpi/appicon.png
        directive: ''
        extra: --categories "Game;Utility"
      - channel: bridge-linux-x64
        rid: linux-x64
        project: GuildWarsCompanion.Bridge/GuildWarsCompanion.Bridge.csproj
        packId: WaypointBridge
        title: Waypoint PC Bridge
        exe: GuildWarsCompanion.Bridge
        icon: GuildWarsCompanion.Bridge/Assets/tray.png
        directive: ''
        extra: --categories "Game;Utility"
      - channel: bridge-win
        rid: win-x64
        project: GuildWarsCompanion.Bridge/GuildWarsCompanion.Bridge.csproj
        packId: WaypointBridge
        title: Waypoint PC Bridge
        exe: GuildWarsCompanion.Bridge.exe
        icon: GuildWarsCompanion.Bridge/Assets/tray.ico
        directive: '"[win]"'
        extra: ''

variables:
  # Keep in step with the Velopack package in the desktop and bridge project files.
  VpkVersion: 1.2.161
  Out: $(Build.ArtifactStagingDirectory)/releases

steps:
  # The whole history: the version counts commits, and a shallow clone would count one.
  - checkout: self
    fetchDepth: 0
    fetchTags: false

  # Which commit the latest release was built from, read from the hidden line its notes end with.
  # The night's run stops here when that is this commit: it was released already, by hand or by an
  # earlier night. A run started by hand always goes on, since asking for it is the reason.
  - bash: |
      set -euo pipefail
      # An undefined variable arrives as its own name, $(ReleasesRepo), not as nothing.
      if [[ -z "${RELEASES_REPO:-}" || "$RELEASES_REPO" == '$('* ]]; then
        echo "##vso[task.logissue type=error]ReleasesRepo is not set; see the top of azure-pipelines.yml."
        exit 1
      fi
      last=$( (curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${RELEASES_REPO#https://github.com/}/releases/latest" \
          | grep -o 'Source: [0-9a-f]\{40\}' | head -1 | cut -d' ' -f2) || true)
      echo "Latest release built from: ${last:-unknown}"
      echo "##vso[task.setvariable variable=LastRelease]$last"
      if [[ "$BUILD_REASON" == "Schedule" && "$last" == "$(git rev-parse HEAD)" ]]; then
        echo "$(git rev-parse --short HEAD) is released already; nothing to do tonight."
        echo "##vso[task.setvariable variable=Released]true"
      fi
    displayName: Released already?
    env:
      RELEASES_REPO: $(ReleasesRepo)
      GITHUB_TOKEN: $(GitHubToken)
      BUILD_REASON: $(Build.Reason)

  # Which packages have anything new since that commit; the rest are skipped below.
  - bash: python3 tools/changed_packages.py
    displayName: What changed?
    condition: and(succeeded(), ne(variables['Released'], 'true'))
    env:
      PACKAGES: ${{ convertToJson(parameters.packages) }}
      LAST_RELEASE: $(LastRelease)
      EVERYTHING: ${{ parameters.everything }}

  - task: UseDotNet@2
    displayName: .NET 10 SDK
    condition: and(succeeded(), ne(variables['Released'], 'true'))
    inputs:
      packageType: sdk
      version: 10.x

  - bash: |
      set -euo pipefail
      majorMinor=$(sed -n 's:.*<CompanionVersionMajorMinor>\(.*\)</CompanionVersionMajorMinor>.*:\1:p' Directory.Build.targets)
      version="$majorMinor.$(git rev-list --count HEAD)"
      echo "Waypoint $version from $(git rev-parse --short HEAD)"
      echo "##vso[task.setvariable variable=Version]$version"
      echo "##vso[build.updatebuildnumber]$version"
      dotnet tool install --global vpk --version "$(VpkVersion)"
      echo "##vso[task.prependpath]$HOME/.dotnet/tools"

      # The release's own page: what changed since the last release. Without notes GitHub shows
      # the tagged commit's message instead, and every release is tagged on the public repo's main,
      # which only moves when the code is published there, so release after release showed the
      # same text. Each release's notes end with the commit it was built from, hidden, and the
      # next one lists from there; with no such line to go on, only this commit is listed.
      notes="$(Agent.TempDirectory)/notes.md"
      last="${LAST_RELEASE:-}"
      [[ "$last" == '$('* ]] && last=""   # set to nothing, it can arrive as its own name
      {
        echo "## Changes"
        echo
        if [[ -n "$last" ]] && git merge-base --is-ancestor "$last" HEAD 2>/dev/null; then
          git log --reverse --no-merges --format='- %s' "$last..HEAD"
        else
          git log -1 --format='- %s' HEAD
        fi
        echo
        echo "<!-- Source: $(git rev-parse HEAD) -->"
      } > "$notes"
      cat "$notes"
    displayName: Version, vpk and notes
    condition: and(succeeded(), ne(variables['Released'], 'true'))
    env:
      LAST_RELEASE: $(LastRelease)

  # Debug, as locally: the test plan's own tests check behaviour that only the debug build has.
  - bash: dotnet test GuildWarsCompanion.Tests -nologo
    displayName: Tests
    condition: and(succeeded(), ne(variables['Released'], 'true'))

  # The previous release is fetched first: vpk makes a delta package against it, which is what
  # most updates then download.
  - ${{ each p in parameters.packages }}:
    - bash: |
        set -euo pipefail
        publish="$(Agent.TempDirectory)/publish-${{ p.channel }}"
        out="$(Out)/${{ p.channel }}"
        mkdir -p "$out"

        dotnet publish "${{ p.project }}" -r ${{ p.rid }} --self-contained true -c Release -o "$publish" -nologo \
          -p:WaypointReleases="$RELEASES_REPO"

        vpk download github --repoUrl "$RELEASES_REPO" --token "$GITHUB_TOKEN" --channel ${{ p.channel }} -o "$out" \
          || echo "No earlier release to make a delta against."

        vpk ${{ p.directive }} pack --packId ${{ p.packId }} --packTitle "${{ p.title }}" --packAuthors mpsoft \
          --packVersion "$(Version)" --packDir "$publish" --mainExe ${{ p.exe }} \
          --runtime ${{ p.rid }} --channel ${{ p.channel }} --icon "${{ p.icon }}" ${{ p.extra }} \
          --releaseNotes "$(Agent.TempDirectory)/notes.md" --outputDir "$out"
      displayName: Pack ${{ p.channel }}
      condition: and(succeeded(), ne(variables['Released'], 'true'), ne(variables['Skip_${{ replace(p.channel, '-', '_') }}'], 'true'))
      env:
        RELEASES_REPO: $(ReleasesRepo)
        GITHUB_TOKEN: $(GitHubToken)

  - task: PublishPipelineArtifact@1
    displayName: Artifact
    condition: and(succeeded(), ne(variables['Released'], 'true'))
    inputs:
      targetPath: $(Out)
      artifact: waypoint-releases

  # Every channel into one release: the first upload makes it, the others add to it.
  - ${{ each p in parameters.packages }}:
    - bash: |
        set -euo pipefail
        vpk upload github --repoUrl "$RELEASES_REPO" --token "$GITHUB_TOKEN" --channel ${{ p.channel }} \
          --outputDir "$(Out)/${{ p.channel }}" --publish --merge \
          --releaseName "Waypoint $(Version)" --tag "v$(Version)"
      displayName: Release ${{ p.channel }}
      # Main only: a run started by hand on another branch builds the artifact and stops.
      condition: and(succeeded(), ne(variables['Released'], 'true'), ne(variables['Skip_${{ replace(p.channel, '-', '_') }}'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      env:
        RELEASES_REPO: $(ReleasesRepo)
        GITHUB_TOKEN: $(GitHubToken)
